<!DOCTYPE html>
<html>
<head>
    <title>ChatApp</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #messages { list-style-type: none; margin: 0; padding: 20px; flex-grow: 1; overflow-y: auto; }
        #messages li { padding: 8px; margin-bottom: 10px; background: #f3f3f3; border-radius: 5px; }
        #form { display: flex; padding: 10px; background: #eee; }
        #input { border: none; padding: 10px; flex-grow: 1; border-radius: 20px; outline: none; }
        #send { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 20px; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <ul id="messages"></ul>
    <form id="form">
        <input id="input" autocomplete="off" placeholder="Type a message..." /><button id="send">Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                // Send message to server
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        // Listen for messages from server
        socket.on('chat message', (msg) => {
            const item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        });
    </script>
</body>
</html>
