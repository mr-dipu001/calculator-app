<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Colorful Calculator</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background: linear-gradient(135deg,#ff512f,#dd2476);

font-family:Segoe UI;

}


.calculator{

background:#111;

padding:20px;

border-radius:20px;

width:300px;

box-shadow:
0 0 20px #000,
0 0 40px #ff00ff;

}


.display{

width:100%;

height:70px;

background:#000;

color:#00ffe7;

font-size:30px;

text-align:right;

padding:10px;

border:none;

border-radius:10px;

margin-bottom:15px;

box-shadow:0 0 15px #00ffe7;

}


.buttons{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:10px;

}


button{

height:60px;

font-size:20px;

border:none;

border-radius:12px;

cursor:pointer;

transition:0.2s;

}


/* number */

.number{

background:linear-gradient(45deg,#434343,#000);

color:white;

}


.number:hover{

background:linear-gradient(45deg,#00c6ff,#0072ff);

}


/* operator */

.operator{

background:linear-gradient(45deg,#ff512f,#f09819);

color:white;

}


.operator:hover{

background:linear-gradient(45deg,#00ff87,#60efff);

color:black;

}


/* equal */

.equal{

background:linear-gradient(45deg,#00c853,#b2ff59);

color:black;

}


.equal:hover{

background:linear-gradient(45deg,#00ffcc,#00cc99);

}


/* clear */

.clear{

background:linear-gradient(45deg,#ff0000,#990000);

color:white;

}


.clear:hover{

background:red;

}


/* backspace */

.back{

background:linear-gradient(45deg,#ff00cc,#3333ff);

color:white;

}

.back:hover{

background:#cc00ff;

}


</style>

</head>

<body>


<div class="calculator">

<input type="text" id="display" class="display" disabled>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">C</button>

<button class="back" onclick="backspace()">⌫</button>

<button class="operator" onclick="appendValue('%')">%</button>

<button class="operator" onclick="appendValue('/')">÷</button>


<button class="number" onclick="appendValue('7')">7</button>

<button class="number" onclick="appendValue('8')">8</button>

<button class="number" onclick="appendValue('9')">9</button>

<button class="operator" onclick="appendValue('*')">×</button>


<button class="number" onclick="appendValue('4')">4</button>

<button class="number" onclick="appendValue('5')">5</button>

<button class="number" onclick="appendValue('6')">6</button>

<button class="operator" onclick="appendValue('-')">−</button>


<button class="number" onclick="appendValue('1')">1</button>

<button class="number" onclick="appendValue('2')">2</button>

<button class="number" onclick="appendValue('3')">3</button>

<button class="operator" onclick="appendValue('+')">+</button>


<button class="number" onclick="appendValue('0')">0</button>

<button class="number" onclick="appendValue('00')">00</button>

<button class="number" onclick="appendValue('.')">.</button>

<button class="equal" onclick="calculate()">=</button>


</div>

</div>


<script>


const display = document.getElementById("display");



function appendValue(value){

display.value += value;

}


function clearDisplay(){

display.value = "";

}


function backspace(){

display.value = display.value.slice(0,-1);

}



/* percentage */

function calculate(){

try{

let expression = display.value;

/* convert % into /100 */

expression = expression.replace(/(\d+)%/g,"($1/100)");

display.value = eval(expression);

}

catch{

display.value="Error";

}

}



</script>


</body>
</html>
